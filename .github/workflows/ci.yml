name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: source/go.sum

      - name: gofmt
        working-directory: source
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: source
        run: go vet ./cmd/... ./internal/...

      - name: Test
        working-directory: source
        run: go test -race ./internal/...

      - name: Build
        working-directory: source
        run: go build ./...

  cross-build:
    name: Cross-compile
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: source/go.sum

      # The SQLite driver is a cgo package: CGO_ENABLED=0 builds link fine but
      # fail at the first database access. cgo stays on, and arm64 needs a
      # cross-compiler.
      - name: Install arm64 cross-compiler
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build linux-${{ matrix.goarch }}
        working-directory: source
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          cp web/src/* cmd/bonghos/webdist/
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
          fi
          go build -ldflags "-s -w" -o "bonghos-linux-${{ matrix.goarch }}" ./cmd/bonghos

      # Catch the cgo trap: prove the binary can actually open a database.
      - name: Verify the binary works
        if: matrix.goarch == 'amd64'
        working-directory: source
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/home"
          ./bonghos-linux-amd64 --home "$tmp/home" user list
          ./bonghos-linux-amd64 version

      - uses: actions/upload-artifact@v4
        with:
          name: bonghos-linux-${{ matrix.goarch }}
          path: source/bonghos-linux-${{ matrix.goarch }}
          retention-days: 14

  shellcheck:
    name: Shell script checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n setup.sh

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S warning setup.sh || true

      - name: setup.sh --help works
        run: ./setup.sh --help

      - name: --pull without --update is rejected
        run: |
          if ./setup.sh --pull 2>/dev/null; then
            echo "--pull should have been rejected without --update"
            exit 1
          fi

  docs:
    name: Documentation consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Required root files exist
        run: |
          for f in setup.sh Tutorial.txt README.md LICENSE; do
            test -f "$f" || { echo "missing root file: $f"; exit 1; }
          done
          test -x setup.sh || { echo "setup.sh is not executable"; exit 1; }
          test -d source || { echo "missing source/"; exit 1; }

      - name: Required source layout exists
        run: |
          for p in source/go.mod source/cmd/bonghos/main.go source/internal \
                   source/migrations source/web/src source/deploy/systemd \
                   source/docs/CHANGELOG.md source/Makefile; do
            test -e "$p" || { echo "missing: $p"; exit 1; }
          done

      - name: No Docker or container files
        run: |
          # Excludes source/third_party/, which holds upstream vendored
          # dependencies. golang.org/x/sys ships its own Dockerfile for
          # regenerating syscall tables; that is upstream's file, not a
          # Bonghos deployment path.
          found=$(find . -path ./.git -prune -o -path ./source/third_party -prune -o \
                    \( -iname 'Dockerfile*' -o -iname 'docker-compose*' \
                       -o -iname 'Containerfile*' -o -iname '*.k8s.yaml' \) -print || true)
          if [ -n "$found" ]; then
            echo "Bonghos must not contain container files:"
            echo "$found"
            exit 1
          fi

      - name: No competing setup entrypoints
        run: |
          for f in setup-dev.sh dev.sh install.sh scripts/setup.sh; do
            if [ -e "$f" ]; then
              echo "competing entrypoint present: $f"
              exit 1
            fi
          done

      - name: Documented setup.sh options really exist
        run: |
          for opt in --dev --build --update --pull --repair --uninstall --home --help; do
            grep -q -- "$opt" setup.sh || { echo "setup.sh does not handle $opt"; exit 1; }
            grep -q -- "$opt" Tutorial.txt || { echo "Tutorial.txt does not mention $opt"; exit 1; }
          done

      - name: Documented service names are consistent
        run: |
          for svc in bonghos.service bonghos-minecraft.service; do
            grep -q "$svc" Tutorial.txt || { echo "Tutorial.txt missing $svc"; exit 1; }
            grep -rq "$svc" source/internal/runtime/systemd/ || { echo "code missing $svc"; exit 1; }
          done

      # A frontend/backend key mismatch once silently disabled every live
      # update in a released build. Nothing caught it because the two sides are
      # written in different languages and no test spans them.
      # A source build stamps its version from three separate places. When they
      # drift, users who build from source get a binary that misreports itself.
      - name: Version strings are consistent
        run: |
          setup_v=$(sed -n 's/^BONGHOS_VERSION="\(.*\)"$/\1/p' setup.sh)
          main_v=$(sed -n 's/^var version = "\(.*\)"$/\1/p' source/cmd/bonghos/main.go)
          make_v=$(sed -n 's/^VERSION *?= *\(.*\)$/\1/p' source/Makefile | tr -d ' ')
          echo "setup.sh=$setup_v main.go=$main_v Makefile=$make_v"
          if [ "$setup_v" != "$main_v" ] || [ "$setup_v" != "$make_v" ]; then
            echo "version strings disagree"; exit 1
          fi
          grep -q "Bonghos version: *$setup_v" Tutorial.txt \
            || { echo "Tutorial.txt does not state version $setup_v"; exit 1; }
          grep -q "Status: v$setup_v" README.md \
            || { echo "README.md does not state version $setup_v"; exit 1; }
          # A tagged build must match the tag it is being released as.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_v="${GITHUB_REF_NAME#v}"
            [ "$tag_v" = "$setup_v" ] || { echo "tag $tag_v != source version $setup_v"; exit 1; }
          fi

      - name: Frontend and backend agree on the WebSocket protocol
        run: |
          grep -q '"action": *"subscribe"\|action: "subscribe"' source/web/src/app.js \
            || { echo "frontend does not send an 'action' subscribe message"; exit 1; }
          grep -q 'case "subscribe"' source/internal/websocket/hub.go \
            || { echo "hub does not handle a subscribe action"; exit 1; }
          grep -q 'case "unsubscribe"' source/internal/websocket/hub.go \
            || { echo "hub does not handle an unsubscribe action"; exit 1; }
          # Every topic the frontend subscribes to must be one the backend
          # actually broadcasts, or the page silently shows nothing.
          for topic in overview console players servers backups performance activity; do
            grep -rq "\"$topic\"" source/internal/app/ \
              || { echo "backend never broadcasts topic '$topic'"; exit 1; }
          done

      - name: Node syntax check for the frontend
        run: node --check source/web/src/app.js

      - name: Repository URL is consistent
        run: |
          for f in README.md Tutorial.txt setup.sh; do
            grep -q "github.com/Chansovisoth/Bonghos" "$f" \
              || { echo "$f does not reference the official repository"; exit 1; }
          done
