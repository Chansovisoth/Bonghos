<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Bonghos</title>
<script>
(() => {
  const key = "bonghos.theme";
  const choice = localStorage.getItem(key) || "system";
  const dark = choice === "dark" || (choice === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = choice;
  document.documentElement.dataset.resolvedTheme = dark ? "dark" : "light";
})();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login-view" class="login-wrap hidden">
  <form id="login-form" class="login-card" autocomplete="on">
    <div class="brand brand-logo" aria-label="Bonghos">
      <span class="brand-name">&gt;BONGHOS</span>
      <svg class="brand-symbol" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M0 0h24v24H0z" fill="none"></path>
        <path fill="currentColor" d="M23 11v2h-1v1h-7v1h-1v2h-1v1h-1v2h-1v1h-1v1H7v-3h1v-3h1v-2H5v1H4v1H3v1H1v-3h1v-4H1V7h2v1h1v1h1v1h4V8H8V5H7V2h3v1h1v1h1v2h1v1h1v2h1v1h7v1z"></path>
      </svg>
    </div>
    <p class="muted">Native Linux Minecraft operations panel</p>

    <!-- Step one collects the username and password. The second step is shown
         unconditionally afterwards, whether or not the account exists, so the
         interface reveals nothing the API would not. -->
    <div id="login-step-1">
      <label>Username<input id="login-user" autocomplete="username" required></label>
      <label>Password<input id="login-pass" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="btn primary" id="login-continue">Continue</button>
    </div>

    <div id="login-step-2" class="hidden">
      <p class="muted" id="login-step-2-who"></p>
      <label class="otp-label" for="login-code">Authenticator code</label>
      <div class="otp-wrap" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <input id="login-code" class="otp-input" inputmode="numeric" pattern="[0-9A-Za-z-]*" maxlength="32" placeholder="6-digit code or recovery code" autocomplete="one-time-code" aria-describedby="login-code-help">
      <p id="login-code-help" class="hint">Paste a six-digit code or enter a recovery code.</p>
      <button type="submit" class="btn primary" id="login-btn">Verify</button>
      <button type="button" class="btn ghost" id="login-back">Back</button>
    </div>

    <div id="login-error" class="error hidden"></div>
  </form>
</div>

<div id="app-view" class="app hidden">
  <header class="mobile-topbar">
    <button id="sidebar-toggle" class="btn ghost icon-button" type="button" aria-label="Open navigation" aria-controls="app-sidebar" aria-expanded="false"></button>
    <div class="brand brand-logo mobile-brand" aria-label="Bonghos">
      <span class="brand-name">&gt;BONGHOS</span>
      <svg class="brand-symbol" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M0 0h24v24H0z" fill="none"></path>
        <path fill="currentColor" d="M23 11v2h-1v1h-7v1h-1v2h-1v1h-1v2h-1v1h-1v1H7v-3h1v-3h1v-2H5v1H4v1H3v1H1v-3h1v-4H1V7h2v1h1v1h1v1h4V8H8V5H7V2h3v1h1v1h1v2h1v1h1v2h1v1h7v1z"></path>
      </svg>
    </div>
    <button class="btn ghost icon-button theme-toggle mobile-theme-toggle" type="button" data-theme-toggle></button>
  </header>
  <button id="sidebar-scrim" class="sidebar-scrim" type="button" aria-label="Close navigation" tabindex="-1"></button>
  <aside id="app-sidebar" class="sidebar">
    <div class="brand brand-logo small" aria-label="Bonghos">
      <span class="brand-name">&gt;BONGHOS</span>
      <svg class="brand-symbol" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M0 0h24v24H0z" fill="none"></path>
        <path fill="currentColor" d="M23 11v2h-1v1h-7v1h-1v2h-1v1h-1v2h-1v1h-1v1H7v-3h1v-3h1v-2H5v1H4v1H3v1H1v-3h1v-4H1V7h2v1h1v1h1v1h4V8H8V5H7V2h3v1h1v1h1v2h1v1h1v2h1v1h7v1z"></path>
      </svg>
    </div>
    <div id="server-picker" class="server-picker"></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div id="whoami" class="muted"></div>
      <div class="sidebar-foot-actions">
        <button id="logout-btn" class="btn ghost">Sign out</button>
        <button class="btn ghost icon-button theme-toggle" type="button" data-theme-toggle></button>
      </div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="toast-host"></div>
<div id="modal-host"></div>
<script src="/app.js"></script>
</body>
</html>
