name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: source/go.sum

      - name: Test before releasing
        working-directory: source
        run: go test ./internal/...

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        working-directory: source
        env:
          CGO_ENABLED: 0
        run: |
          cp web/src/* cmd/bonghos/webdist/
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build \
              -ldflags "-s -w -X github.com/Chansovisoth/Bonghos/internal/app.Version=${{ steps.version.outputs.version }}" \
              -o "../bonghos-linux-$arch" ./cmd/bonghos
          done

      - name: Package source archive
        run: |
          v="${{ steps.version.outputs.version }}"
          # setup.sh, Tutorial.txt, README.md, LICENSE and source/ sit at the
          # archive root — no extra nesting layer.
          tar --exclude-vcs \
              --exclude='./bonghos-linux-*' \
              --exclude='./source/bin' \
              --transform "s,^\./,Bonghos-$v/," \
              -czf "Bonghos-$v-source.tar.gz" \
              ./setup.sh ./Tutorial.txt ./README.md ./LICENSE ./source ./.github

      - name: Generate checksums
        run: sha256sum bonghos-linux-* Bonghos-*-source.tar.gz > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bonghos-linux-amd64
            bonghos-linux-arm64
            Bonghos-*-source.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Installation

            ```bash
            git clone https://github.com/Chansovisoth/Bonghos.git ~/bonghos-source
            cd ~/bonghos-source
            ./setup.sh
            ```

            Or download the source archive below, extract it, and run `./setup.sh`.

            Verify downloads with `sha256sum -c SHA256SUMS.txt`.

            See `Tutorial.txt` for complete instructions.
