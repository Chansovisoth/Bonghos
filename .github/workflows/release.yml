name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.2.0-rc.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Test before releasing
        working-directory: source
        run: go test ./internal/...

      - name: Vulnerability scan before releasing
        working-directory: source
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./cmd/... ./internal/...

      - name: Determine version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$REQUESTED_TAG"
          fi
          case "$tag" in
            v*) ;;
            *) echo "release tag must begin with v" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # mattn/go-sqlite3 is a cgo package. Building with CGO_ENABLED=0 would
      # publish binaries that fail at the first database access, so cgo stays
      # enabled and arm64 uses a cross-compiler.
      - name: Install arm64 cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binaries
        working-directory: source
        env:
          CGO_ENABLED: 1
        run: |
          cp web/src/* cmd/bonghos/webdist/
          LD="-s -w -X github.com/Chansovisoth/Bonghos/internal/app.Version=${{ steps.version.outputs.version }}"
          GOOS=linux GOARCH=amd64 go build -ldflags "$LD" -o ../bonghos-linux-amd64 ./cmd/bonghos
          GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -ldflags "$LD" -o ../bonghos-linux-arm64 ./cmd/bonghos

      - name: Verify the amd64 binary works before publishing
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/home"
          ./bonghos-linux-amd64 --home "$tmp/home" user list
          ./bonghos-linux-amd64 version

      - name: Package source archive
        run: |
          v="${{ steps.version.outputs.version }}"
          # The archive contains a single Bonghos-<version>/ directory, which
          # is the normal convention for a release tarball. setup.sh,
          # Tutorial.txt, README.md, TECHNICAL.md, LICENSE and source/ sit
          # directly inside it. There is no second nesting layer, so the user is
          # one `cd` away from running ./setup.sh.
          tar --exclude-vcs \
              --exclude='./bonghos-linux-*' \
              --exclude='./source/bin' \
              --transform "s,^\./,Bonghos-$v/," \
              -czf "Bonghos-$v-source.tar.gz" \
              ./setup.sh ./Tutorial.txt ./README.md ./TECHNICAL.md ./LICENSE ./source ./.github

      - name: Generate checksums
        run: sha256sum bonghos-linux-* Bonghos-*-source.tar.gz > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            bonghos-linux-amd64
            bonghos-linux-arm64
            Bonghos-*-source.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Installation

            ```bash
            git clone https://github.com/Chansovisoth/Bonghos.git ~/bonghos-source
            cd ~/bonghos-source
            ./setup.sh
            ```

            Or download the source archive below, extract it, and run `./setup.sh`.

            Verify downloads with `sha256sum -c SHA256SUMS.txt`.

            See `Tutorial.txt` for complete instructions.
